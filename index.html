<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Click the Circle</title>
  <style>
    body {
      margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; height: 100vh; background: #222;
    }
    #game {
      position: relative; width: 300px; height: 300px; background: #444; border-radius: 10px;
    }
    #circle {
      position: absolute; width: 50px; height: 50px; background: #ff5722; border-radius: 50%;
      cursor: pointer;
    }
    #score {
      color: #fff; font-family: sans-serif; font-size: 18px; margin-top: 20px; text-align: center;
    }
  </style>
</head>
<body>
  <div>
    <div id="game"></div>
    <div id="score">Рахунок: 0</div>
  </div>

  <script>
    const game = document.getElementById('game');
    const scoreDisplay = document.getElementById('score');
    let score = 0;

    function randomPosition() {
      const maxX = game.clientWidth - 50;
      const maxY = game.clientHeight - 50;
      return {
        x: Math.floor(Math.random() * maxX),
        y: Math.floor(Math.random() * maxY)
      };
    }

    function createCircle() {
      const circle = document.createElement('div');
      circle.id = 'circle';
      const pos = randomPosition();
      circle.style.left = pos.x + 'px';
      circle.style.top = pos.y + 'px';
      circle.addEventListener('click', () => {
        score++;
        scoreDisplay.textContent = 'Рахунок: ' + score;
        game.removeChild(circle);
        createCircle();
      });
      game.appendChild(circle);
    }

    createCircle();
  </script>
</body>
</html>
